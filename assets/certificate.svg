  <text x="60" y="644" font-size="13.5" font-weight="700" fill="#1f2733">TOSHKENT, YUNUSOBOD DISTRICT, OQTEPA MFY,</text>
  <text x="60" y="662" font-size="13.5" font-weight="700" fill="#1f2733">OQTEPA 5-TOR KO‘CHASI, 20-22-UY</text>

