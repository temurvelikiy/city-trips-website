<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 100" font-family="Poppins,Arial,sans-serif">
  <!-- ===== MARK ===== -->
  <g>
    <!-- open orange ring (C) -->
    <path d="M70 34 A28 28 0 1 0 74 60" fill="none" stroke="#F5751F" stroke-width="9" stroke-linecap="round"/>
