  <text x="212" y="54" font-weight="800" font-size="33" letter-spacing="1" fill="#6C2BD9">TRIPS</text>
  <text x="124" y="78" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="13" fill="#F5751F">Travel. Trusted. Together.</text>
